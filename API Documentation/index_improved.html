<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style type="text/css">
    @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

    :root {
      /*  Colors  */
      --color-main: #3dade2;
      --color-main-low: color-mix(in srgb, var(--color-main) 15%, transparent);
      --color-second: #FDF4E7;
      --color-second2: #092846;
      --text-white: white;
      --text-black: black;
      --border: #7575757c;
      --border-low: #75757515;
      --trans-grey: rgba(128, 128, 128, 0.09);
      /*----------*/
      /*    Font   */
      --icon-size: 1.5rem;
      --text-s: 0.6rem;
      --text-m: 0.8rem;
      --text-l: 1rem;
      --text-xl: 1.2rem;
      --text-xxl: 1.5rem;
      /*----------*/
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #E5E8EB;
        --text-low: #ffffff52;
        --bg: #1C1C1D;
        --bgc: #252728;
        --logo-color: var(--color-second);
      }
    }

    @media (prefers-color-scheme: light) {
      :root {
        --text: #333;
        --text-low: #626569;
        --bg: #F2F4F7;
        --bgc: #FFFFFF;
        --logo-color: var(--color-second2);
      }
    }

    * {
      box-sizing: border-box;
      scroll-behavior: smooth;
      padding: 0;
      margin: 0;
      font-family: "Poppins", sans-serif;
      font-weight: 400;
      font-style: normal;
      text-rendering: optimizeLegibility !important;
      font-smooth: always !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: var(--text);
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-direction: column;
      background-color: var(--bg);
    }

    .header {
      width: 100%;
      padding: 1em 2em;
      height: 8em;
    }

    .logo-title {
      display: flex;
      align-items: center;
    }

    .st0 {
      stroke: #000;
    }

    .st0,
    .st1 {
      fill: none;
      stroke-miterlimit: 10;
    }

    .st1 {
      stroke: var(--logo-color);
      stroke-width: 13px;
    }

    .st2 {
      fill: var(--color-main);
    }

    .st3 {
      fill: var(--logo-color);
    }

    .logo {
      width: 30px;
      height: 30px;
      margin-right: 1em;
      background-color: white;
      border-radius: 0.5em;
      padding: 0.125em;
    }

    .title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .head-title {
      font-size: 1.25rem;
      margin-top: 1em;
      color: var(--text);
    }

    .head-description {
      font-size: 0.9rem;
      margin-top: 0.25em;
      color: var(--text-low);
    }

    .main-container {
      width: 100%;
      height: calc(100% - 8em);
      overflow: hidden;
      overflow-y: auto;
      padding: 0 2em 1em 2em;
    }

    .main-container::-webkit-scrollbar {
      width: 6px;
      background-color: var(--trans-grey);
      border-radius: 5px;
    }

    .main-container::-webkit-scrollbar-thumb {
      background: var(--color-main);
      border-radius: 5px;
    }

    .api {
      width: 100%;
      overflow: hidden;
      height: 4em;
      margin: 1em 0;
      transition: ease-in-out 0.6s;
    }

    .api-expended {}

    .api-head {
      width: 100%;
      height: 4em;
      border-radius: 0.625rem;
      background-color: var(--bgc);
      padding: 0 2em;
      display: flex;
      transition: ease-in-out 0.5s;
      align-items: center;
    }

    .api-head:hover,
    .endpoint:hover {
      opacity: 0.8;
      border: 1px solid rgba(122, 122, 122, 0.312);
    }

    .target {
      font-size: 1rem;
      color: var(--text);
      font-weight: 500;
    }

    .api-description {
      font-size: 0.8rem;
      color: var(--text-low);
      margin-left: 2em;
    }

    .chevron {
      width: auto;
      height: 1.2em;
      fill: var(--text-low);
      transform: rotate(180deg);
      transition: ease-in-out 0.6s;
    }

    .active {
      transform: rotateZ(0deg);
    }

    .api-head .chevron {
      margin-left: auto;
    }

    .endpoints {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: fit-content;
    }

    .endpoint {
      width: 100%;
      display: flex;
      flex-direction: column;
      padding: 0 2em;
      background-color: var(--bgc);
      margin-top: 0.5em;
      border-radius: 10px;
      height: 4em;
      overflow: hidden;
      transition: ease-in-out 0.6s;
    }

    .expanded {
      height: 12.5em;
    }

    .endpoint-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 4em;
    }

    .methode {
      border-radius: 5px;
      padding: 0.25em 0.625em;
    }

    .methode p {
      font-size: 0.8rem;
      color: white;
    }

    .m-get {
        background-color: rgb(96, 218, 112);
    }
    
    .m-post {
        background-color: rgb(73, 165, 226);
    }

    .m-put {
        background-color: rgb(251, 141, 56);
    }

    .m-delete {
        background-color: rgb(229, 75, 75);
    }

    .m-patch {
        background-color: rgb(163, 60, 241);
    }

    .route {
      font-size: 0.8rem;
      color: var(--text-low);
      margin-left: 2em;
    }

    .flex-row {
      display: flex;
      flex-direction: row;
      align-items: center;
    }

    .endpoint-title {
      font-size: 0.8rem;
      color: var(--text);
    }

    .lock {
      margin-right: 1em;
      width: auto;
      height: 1em;
      fill: var(--text-low);
    }

    .endpoint-body {
      width: 100%;
      display: flex;
      flex-direction: column;
      border-top: 2px solid var(--border-low);
      padding: 1em 0;
    }

    .endpoint-detail {
      font-size: 1rem;
      color: var(--text);
    }

    .detailed-text {
      font-size: 0.75rem;
      color: var(--text-low);
      padding: 1em 0;
    }

    .text {
      color: var(--text);
      opacity: 1;
    }

    .center {
      align-self: center;
      justify-self: center;
      margin: auto;
    }

    @media (max-width: 767px) {
      .header {
        padding: 1em;
        height: 7em;
      }

      .head-title {
        font-size: 0.9rem;
        margin-top: 0.5em;
      }

      .head-description {
        font-size: 0.75rem;
        margin-top: 0.5em;
      }

      .main-container {
        height: calc(100% - 7em);
        padding: 0 1em 1em 1em;
      }

      .api-head {
        padding: 0 1em;
      }

      .target {
        font-size: 0.8rem;
      }

      .api-description {
        font-size: 0.6rem;
      }

      .chevron {
        height: 1em;
      }

      .main-container::-webkit-scrollbar {
        width: 0;
      }

      .endpoint {
        padding: 0 1em;
      }

      .methode p {
        font-size: 0.5rem;
      }

      .route {
        font-size: 0.55rem;
        margin-left: 1em;
      }

      .endpoint-title {
        font-size: 0.6rem;
      }

      .endpoint-detail {
        font-size: 0.7rem;
      }

      .detailed-text {
        font-size: 0.65rem;
      }

      .title {
        display: none;
      }
    }

    /* Code block styling */
    .code-block {
      background-color: var(--bgc);
      border: 1px solid var(--border-low);
      border-radius: 0.5rem;
      padding: 1em;
      margin: 0.5em 0;
      font-size: 0.8rem;
      font-family: 'Courier New', monospace;
      overflow-x: auto;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .code-block code {
      color: var(--text);
      font-family: 'Courier New', monospace;
    }

    /* Parameters table styling */
    .params-table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.5em 0;
      font-size: 0.75rem;
      border: 1px solid var(--border-low);
      border-radius: 0.5rem;
      overflow: hidden;
    }

    .params-table thead {
      background-color: var(--border-low);
    }

    .params-table th {
      padding: 0.75em;
      text-align: left;
      font-weight: 600;
      color: var(--text);
      border-right: 1px solid var(--border-low);
    }

    .params-table th:last-child {
      border-right: none;
    }

    .params-table td {
      padding: 0.75em;
      border-right: 1px solid var(--border-low);
      border-bottom: 1px solid var(--border-low);
      color: var(--text);
    }

    .params-table td:last-child {
      border-right: none;
    }

    .params-table tr:last-child td {
      border-bottom: none;
    }

    .params-table code {
      background-color: var(--trans-grey);
      padding: 0.2em 0.4em;
      border-radius: 0.2rem;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }

    .badge {
      display: inline-block;
      padding: 0.3em 0.6em;
      border-radius: 0.3rem;
      font-size: 0.85em;
      font-weight: 600;
    }

    .badge.required {
      background-color: rgba(241, 80, 74, 0.2);
      color: #F1504A;
    }

    .badge.optional {
      background-color: rgba(117, 117, 117, 0.2);
      color: var(--text-low);
    }
  </style>
  <title>KroGi API Endpoints</title>
</head>

                {
                  "name": "Authorization",
                  "type": "string",
                  "required": true,
                  "description": "header parameter"
                }
              ],
              "request": null,
              "response": {
                "success": true,
                "message": "Operation completed successfully"
              }
            },
            {
              "method": "POST",
              "rout": "/api/v1/integrations/payments/webhook",
              "description": "Payment Webhook",
              "detail": "Payment Webhook endpoint. Used to perform payment webhook within the system.",
              "auth": false,
              "parameters": [],
              "request": null,
              "response": {
                "success": true,
                "message": "Operation completed successfully"
              }
            },
            {
              "method": "GET",
              "rout": "/api/v1/integrations/payments/history",
              "description": "Retrieve Payment History",
              "detail": "Retrieve Payment History endpoint. Used to perform retrieve payment history within the system.",
              "auth": true,
              "parameters": [{
                "name": "Authorization",
                "type": "string",
                "required": false,
                "description": "header parameter"
              }],
              "request": null,
              "response": {
                "success": true,
                "message": "Operation completed successfully"
              }
            }
          ]
        }
      ]
    }
    const container = document.getElementById('mainContainer');

    const expendContainer = (apiContainer) => {
      var counter = 0;
      var activeCounter = 0;
      apiContainer.children[1].childNodes.forEach(child => {
        counter++;
        activeCounter = child.classList.contains("expanded") ? activeCounter + 1 : activeCounter;
      })
      apiContainer.style.height = `${4+(4.5 * counter - activeCounter) + 9.5 * activeCounter}em`
    }

    data.data.forEach(api => {
      const apiContainer = document.createElement('div');
      apiContainer.className = "api";
      const apiHead = document.createElement('div');
      apiHead.className = "api-head";
      apiHead.addEventListener('click', () => {
        const chevron = apiHead.children[2];
        if (chevron.classList.contains('active')) {
          chevron.classList.remove('active');
        } else {
          chevron.classList.add('active');
        }
        if (apiContainer.classList.contains('api-expended')) {
          apiContainer.style.height = "4em"
          apiContainer.classList.remove('api-expended');
        } else {
          apiContainer.classList.add('api-expended');
          expendContainer(apiContainer)
        }
      })
      apiHead.innerHTML =
        `
                    <h3 class="target">${api.name}</h3>
                    <p class="api-description">${api.description}</p>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" class="chevron">
                        <path d="M297.4 169.4C309.9 156.9 330.2 156.9 342.7 169.4L534.7 361.4C547.2 373.9 547.2 394.2 534.7 406.7C522.2 419.2 501.9 419.2 489.4 406.7L320 237.3L150.6 406.6C138.1 419.1 117.8 419.1 105.3 406.6C92.8 394.1 92.8 373.8 105.3 361.3L297.3 169.3z"/>
                    </svg>
                `;
      apiContainer.appendChild(apiHead);

      const endpointsContainer = document.createElement('div');
      endpointsContainer.className = 'endpoints';

      api.endpoints.forEach(endpoint => {
        const endpointContainer = document.createElement('div');
        endpointContainer.className = 'endpoint';
        endpointContainer.addEventListener('click', () => {
          if (endpointContainer.classList.contains('expanded')) {
            endpointContainer.classList.remove('expanded');
          } else {
            endpointContainer.classList.add('expanded');
          }
          const chevron = endpointContainer.children[0].children[2].children[endpointContainer.children[0].children[2].children.length - 1];
          if (chevron.classList.contains('active')) {
            chevron.classList.remove('active');
          } else {
            chevron.classList.add('active');
          }
          const apiContainer = endpointContainer.parentElement.parentElement
          expendContainer(apiContainer)
        })
        endpointContainer.innerHTML = `
                    <div class="endpoint-head">
                        <div class="flex-row">
                            <div class="methode m-${endpoint.method.toLowerCase()}">
                                <p>${endpoint.method.toUpperCase()}</p>
                            </div>
                            <p class="route">${endpoint.rout}</p>
                        </div>
                        <p class="endpoint-title">${endpoint.description}</p>
                        <div class="flex-row">
                            ${endpoint.auth?'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" class="lock"><path d="M256 160L256 224L384 224L384 160C384 124.7 355.3 96 320 96C284.7 96 256 124.7 256 160zM192 224L192 160C192 89.3 249.3 32 320 32C390.7 32 448 89.3 448 160L448 224C483.3 224 512 252.7 512 288L512 512C512 547.3 483.3 576 448 576L192 576C156.7 576 128 547.3 128 512L128 288C128 252.7 156.7 224 192 224z"/></svg>':""}
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" class="chevron">
                                <path d="M297.4 169.4C309.9 156.9 330.2 156.9 342.7 169.4L534.7 361.4C547.2 373.9 547.2 394.2 534.7 406.7C522.2 419.2 501.9 419.2 489.4 406.7L320 237.3L150.6 406.6C138.1 419.1 117.8 419.1 105.3 406.6C92.8 394.1 92.8 373.8 105.3 361.3L297.3 169.3z"/>
                            </svg>
                        </div>
                    </div>
                    <div class="endpoint-body">
                        <h3 class="endpoint-detail">Endpoint details</h3>
                        <p class="detailed-text">${endpoint.detail}</p>
                        <div class="flex-row">
                            <p class="detailed-text">Method: <span class="text">${endpoint.method.toUpperCase()}</span></p>
                            <p class="detailed-text center">Authentification: <span class="text">${endpoint.auth?"Required":"Not Required"}</span></p>
                        </div>
                        ${endpoint.parameters && endpoint.parameters.length > 0 ? `
                            <h4 class="endpoint-detail" style="margin-top: 1em;">Parameters</h4>
                            <table class="params-table">
                                <thead>
                                    <tr>
                                        <th>Parameter</th>
                                        <th>Type</th>
                                        <th>Required</th>
                                        <th>Description</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${endpoint.parameters.map(param => `
                                        <tr>
                                            <td><code>${param.name}</code></td>
                                            <td><code>${param.type}</code></td>
                                            <td>${param.required ? '<span class="badge required">Yes</span>' : '<span class="badge optional">No</span>'}</td>
                                            <td>${param.description}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        ` : ''}
                        ${endpoint.request ? `
                            <h4 class="endpoint-detail" style="margin-top: 1em;">Request Example</h4>
                            <pre class="code-block"><code>${JSON.stringify(endpoint.request, null, 2)}</code></pre>
                        ` : ''}
                        ${endpoint.response ? `
                            <h4 class="endpoint-detail" style="margin-top: 1em;">Response Example</h4>
                            <pre class="code-block"><code>${JSON.stringify(endpoint.response, null, 2)}</code></pre>
                        ` : ''}
                    </div>
                `;

        endpointsContainer.appendChild(endpointContainer);
      })
      apiContainer.appendChild(endpointsContainer);
      container.appendChild(apiContainer);
    });
  </script>
</body>

</html>
